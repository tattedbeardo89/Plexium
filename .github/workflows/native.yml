name: Plexium native PS5 build
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths:
      - '.github/workflows/native.yml'
      - 'ci/**'
      - 'ps5/**'
      - 'patches/**'
      - 'src/**'
      - 'shaders/**'
      - 'assets/**'
      - 'third_party/**'
      - 'tools/**'
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: plexium-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve disk for the native compiler and static libraries
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Host prerequisites and pinned artwork tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libcurl4-openssl-dev libgnutls28-dev libvulkan-dev python3-venv openssl
          python3 -m venv /tmp/plexium-tools
          /tmp/plexium-tools/bin/pip install -r tools/requirements.txt
          echo /tmp/plexium-tools/bin >> "$GITHUB_PATH"
      - name: Host regressions and sanitizers
        env:
          VULKAN_HEADERS: /usr/include
        run: |
          bash host/check.sh
          bash host/test-gfx-failures.sh
          SANITIZE=1 bash host/test-gfx-failures.sh
          bash host/check-native-source.sh
          bash host/test-native-transport.sh
          SANITIZE=1 bash host/check.sh
      - name: Restore exact native dependency cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .native-cache
          key: plexium-native-v1-${{ runner.os }}-${{ hashFiles('ci/build-lock.json', 'ci/source-checksums.txt', 'ps5/**', 'patches/**') }}
      - name: Install signed toolchain, build and validate real PS5 title
        id: native
        run: |
          mkdir -p artifacts/logs
          bash ci/hosted-native.sh 2>&1 | tee artifacts/logs/hosted-native.log
      - name: Save verified native dependency cache
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('.native-cache/plexium-work/.ci-dependencies') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .native-cache
          key: plexium-native-v1-${{ runner.os }}-${{ hashFiles('ci/build-lock.json', 'ci/source-checksums.txt', 'ps5/**', 'patches/**') }}
      - name: Upload installation ZIP
        id: install
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plexium-PPSA85421-${{ github.sha }}
          path: artifacts/Plexium-PPSA85421.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload matching native debug ELF
        id: debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plexium-native-debug-${{ github.sha }}
          path: artifacts/Plexium-native-debug.elf
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload native source kit
        id: source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plexium-native-source-${{ github.sha }}
          path: |
            artifacts/Plexium-native-source.tar.gz
            artifacts/Plexium-source.bundle
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload checksums and delivery documentation
        id: delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plexium-delivery-${{ github.sha }}
          path: |
            artifacts/SHA256SUMS
            artifacts/native-validation.json
            artifacts/INSTALLATION.md
            artifacts/DELIVERY.md
          if-no-files-found: error
          retention-days: 90
      - name: Record download links
        env:
          INSTALL_URL: ${{ steps.install.outputs.artifact-url }}
          DEBUG_URL: ${{ steps.debug.outputs.artifact-url }}
          SOURCE_URL: ${{ steps.source.outputs.artifact-url }}
          DELIVERY_URL: ${{ steps.delivery.outputs.artifact-url }}
        run: |
          echo "Native source: $GITHUB_SHA; physical PS5/live Plex acceptance NOT TESTED." >> "$GITHUB_STEP_SUMMARY"
          echo "Installation: $INSTALL_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Debug: $DEBUG_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Checksums/instructions: $DELIVERY_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Mirror the verified build to the existing draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/upload-draft.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plexium-failure-${{ github.sha }}
          path: artifacts/logs/
          if-no-files-found: error
          retention-days: 90
      - name: Record bounded native failure diagnostics in the existing draft
        if: failure() && steps.native.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/report-native-failure.sh

  free-tv-compatibility:
    name: Report optional Free TV provider compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Probe metadata with a fresh anonymous Plexium identity
        run: python3 tools/probe-free-tv.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plexium-Free-TV-compatibility-${{ github.sha }}
          path: artifacts/free-tv-compatibility.json
          if-no-files-found: error
          retention-days: 90
